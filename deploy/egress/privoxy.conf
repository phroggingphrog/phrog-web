listen-address 0.0.0.0:8118
# Everything leaves through the tencentvps SSH tunnel. Per-domain rules would
# not work here: Crawl4AI CONNECTs to the pinned IP, never the hostname.
# The homelab-IP fallback is the separate crawl4ai-home container instead.
forward-socks5t / 127.0.0.1:1080 .
toggle 0
enable-remote-toggle 0
enable-edit-actions 0
accept-intercepted-requests 0
max-client-connections 64
