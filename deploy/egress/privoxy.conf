listen-address 0.0.0.0:8118
# All traffic uses the SSH tunnel: Crawl4AI CONNECTs to pinned IPs, preventing hostname rules.
# Direct homelab egress uses the separate crawl4ai-home container.
forward-socks5t / 127.0.0.1:1080 .
toggle 0
enable-remote-toggle 0
enable-edit-actions 0
accept-intercepted-requests 0
max-client-connections 64
